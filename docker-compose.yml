# docker-compose.yml — Vinheria Digital (Local Development)
# Usage:
#   docker compose --profile core up -d                      # Postgres + Valkey
#   docker compose --profile core --profile events up -d      # + Kafka
#   docker compose --profile core --profile events --profile connect --profile tools up -d  # + Debezium + Kafka UI
#   docker compose --profile core --profile events --profile connect --profile search --profile saga --profile tools up -d  # all

services:

  # ─── PostgreSQL 16 ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vinheria-postgres
    profiles: [core]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vinheria
      POSTGRES_PASSWORD: vinheria_dev
      POSTGRES_MULTIPLE_DATABASES: catalog,order_db,inventory,pricing,payment,shipping,identity
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init.sh
    command: >
      postgres
        -c wal_level=logical
        -c max_wal_senders=10
        -c max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vinheria"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Valkey 8 (Redis-compatible) ─────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: vinheria-valkey
    profiles: [core]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka KRaft (sem Zookeeper) ─────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: vinheria-kafka
    profiles: [events]
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: vinheria-local-cluster-001
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Kafka Connect + Debezium ────────────────────────
  kafka-connect:
    image: debezium/connect:2.5
    container_name: vinheria-debezium
    profiles: [connect]
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9094
      GROUP_ID: vinheria-connect
      CONFIG_STORAGE_TOPIC: vinheria.connect.configs
      OFFSET_STORAGE_TOPIC: vinheria.connect.offsets
      STATUS_STORAGE_TOPIC: vinheria.connect.status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ─── OpenSearch ──────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: vinheria-opensearch
    profiles: [search]
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: Vinheria_Dev_2024!
      DISABLE_SECURITY_PLUGIN: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # ─── Orkes Conductor CE ──────────────────────────────
  conductor:
    image: orkesio/orkes-conductor-community-standalone:latest
    container_name: vinheria-conductor
    profiles: [saga]
    ports:
      - "8080:8080"
      - "5001:5000"

  # ─── Kafka UI (dev tool) ─────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vinheria-kafka-ui
    profiles: [tools]
    ports:
      - "9090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vinheria-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    depends_on:
      - kafka
      - kafka-connect

  # ─── Frontend (Angular dev server) ────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: vinheria-frontend
    profiles: [frontend]
    ports:
      - "4200:4200"
    # Read-only rootfs + tmpfs only on paths Angular needs to write at runtime.
    # uids set to 1000 (matches Dockerfile USER + chown) so UID 1000 can create subdirs.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.angular/cache:uid=1000,gid=1000,mode=0700
      - /app/node_modules/.cache:uid=1000,gid=1000,mode=0700
      - /app/dist:uid=1000,gid=1000,mode=0700
    # Bind mount source for hot reload — node_modules stays in image layer (NOT bind-mounted)
    volumes:
      - ./frontend:/app:cached
      # Anonymous volume shadows host node_modules so the container's npm-installed deps win
      - /app/node_modules
    cap_drop:
      [ALL]
    security_opt:
      ["no-new-privileges:true"]
    # No /var/run/docker.sock mount — explicitly avoided per docker.md
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:4200/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:
  postgres_data:
  valkey_data:
  kafka_data:
  opensearch_data:
