# sonar-project.properties — Vinheria Digital
# Each microservice overrides sonar.projectKey via Gradle plugin or CI env var

sonar.projectKey=vinheria-digital
sonar.projectName=Vinheria Digital
sonar.sources=src/main/kotlin
sonar.tests=src/test/kotlin
sonar.kotlin.detekt.reportPaths=build/reports/detekt/detekt.xml
sonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml
sonar.sourceEncoding=UTF-8

# Quality Gate conditions (fail PR if):
#   - Coverage < 80% on new code
#   - Duplicated Lines > 3%
#   - Maintainability Rating worse than A
#   - Reliability Rating worse than A
#   - Security Rating worse than A
#   - Security Hotspots reviewed < 100%
