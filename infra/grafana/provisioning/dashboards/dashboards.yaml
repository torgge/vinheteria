# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'Vinheria Dashboards'
    orgId: 1
    folder: 'Vinheria Digital'
    folderUid: vinheria
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
