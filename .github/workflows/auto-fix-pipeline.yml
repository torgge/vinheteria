name: "🤖 Auto-Fix Pipeline (Nemotron)"

on:
  workflow_run:
    workflows:
      - "CI Pipeline"
      - "PR Validation"
      - "Security & Quality Gate"
    types: [completed]

jobs:
  auto-fix:
    name: "🔧 Diagnose & Fix with Nemotron"
    runs-on: ubuntu-latest

    # Only trigger on genuine failures; skip bots and dependabot branches to avoid loops.
    # Skip runs from forks: their logs are attacker-controlled input to a contents:write agent.
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_commit.author.name != 'github-actions[bot]' &&
      !startsWith(github.event.workflow_run.head_branch, 'dependabot/')

    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The agent can read workspace files; don't leave the token in .git/config.
          # PR creation goes through the API with GITHUB_TOKEN, not git push.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/auto-fix/requirements.txt

      - name: Run Nemotron auto-fix agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python scripts/auto-fix/fix_pipeline.py
