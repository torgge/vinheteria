# .github/workflows/ci.yml — Build & Test Pipeline
# ─────────────────────────────────────────────────────
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/vinheria

jobs:
  # Detects which parts of the monorepo are present so backend jobs are
  # skipped until the Kotlin/Quarkus services land. Auto-enables once a
  # Gradle wrapper or settings file is committed.
  detect:
    name: "🔎 Detect Project Layout"
    runs-on: ubuntu-latest
    outputs:
      has_backend: ${{ steps.check.outputs.has_backend }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Detect Gradle backend
        run: |
          if [ -f gradlew ] || ls settings.gradle* >/dev/null 2>&1; then
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No Gradle backend detected — backend jobs will be skipped."
          fi

  lint:
    name: "🔍 Lint (Ktlint + Detekt)"
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Ktlint Check
        run: ./gradlew ktlintCheck
      - name: Detekt
        run: ./gradlew detekt
      - name: Upload SARIF
        if: always() && hashFiles('build/reports/ktlint/**') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/ktlint/

  test:
    name: "🧪 Tests (Unit + Integration + Arch)"
    runs-on: ubuntu-latest
    needs: [detect, lint]
    if: needs.detect.outputs.has_backend == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vinheria_test
          POSTGRES_USER: vinheria
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vinheria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit Tests (Kotest + MockK)
        run: ./gradlew test -Punit

      - name: Integration Tests (Testcontainers)
        run: ./gradlew test -Pintegration

      - name: Architecture Tests (ArchUnit)
        run: ./gradlew test -Parchitecture

      - name: Coverage (Kover ≥ 80%)
        run: ./gradlew koverVerify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/

  build:
    name: "🏗️ Build & Push Image"
    runs-on: ubuntu-latest
    needs: [detect, test]
    if: needs.detect.outputs.has_backend == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6

      - name: Build Native Image
        run: ./gradlew build -Dquarkus.native.enabled=true -Dquarkus.native.container-build=true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ github.event.repository.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ github.event.repository.name }}:latest

  k6-smoke:
    name: "🚀 K6 Smoke Tests"
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: needs.detect.outputs.has_backend == 'true' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Start services
        run: docker compose up -d && sleep 30
      - name: Run K6 Smoke
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/scripts/smoke/catalog-smoke.js
          flags: --env BASE_URL=http://localhost:8081
