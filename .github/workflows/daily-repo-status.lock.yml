name: "📊 Daily Repository Status Report"

on:
  schedule:
    - cron: "29 22 * * 1-5"  # weekdays ~22:29 UTC
  workflow_dispatch:

concurrency:
  group: "daily-repo-status"
  cancel-in-progress: false

jobs:
  report:
    name: "📊 Generate Daily Report (DeepSeek)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore state cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/daily-status-state
          key: daily-status-state-${{ github.run_id }}
          restore-keys: daily-status-state-

      - name: Install dependencies
        run: pip install -r scripts/daily-status/requirements.txt

      - name: Generate daily status report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STATE_FILE: /tmp/daily-status-state/state.json
        run: python scripts/daily-status/generate_report.py

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: /tmp/daily-status-state
          key: daily-status-state-${{ github.run_id }}
