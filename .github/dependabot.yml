  # npm (frontend — Angular/Material)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "frontend"]
    groups:
      angular:
        patterns: ["@angular*"]

  # Docker (base images)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]

  # TODO: uncomment when infra/terraform/ exists
